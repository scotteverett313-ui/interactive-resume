<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Work in progress: Scott Everett's interactive resume as a brain map of what he learns, teaches, and is improving.">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Inside Scott's Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one sticky stage. Scroll scrubs the intro, then the stage becomes a clickable brain map with pages layered on top.
   Single committed look (ink on SE|Design colors), so no dark variant. */
:root{
  --yellow:#ffffff;
  --ink:#1a1a1a;
  --paper:#ffffff;
  --brain:#ffffff;
  --blue:#1a1a1a;
  --muted:#555555;
  --display:'Bricolage Grotesque','Arial Black',system-ui,sans-serif;
  --body:'Work Sans',system-ui,-apple-system,sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
html,body{background:var(--yellow);color:var(--ink)}
body{font-family:var(--body);font-size:16px;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

#intro{position:relative;height:520vh}
#intro.done{height:100vh;height:100dvh}
.stage{position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden;background:var(--yellow)}
html,body{overscroll-behavior-y:none}

/* animated grain, standing in for the texture gif */
.grain{position:absolute;inset:-50%;pointer-events:none;opacity:.5;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.16  0 0 0 0 0.16  0 0 0 0 0.16  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain .6s steps(4) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}100%{transform:translate(0,0)}}

#introSvg{position:absolute;inset:0;width:100%;height:100%}
#mapLayer{position:absolute;inset:0;background:var(--brain);opacity:0;pointer-events:none}
.stage.is-done #mapLayer{pointer-events:auto}
#mapSvg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}

.node{cursor:pointer;outline:none}
.stage.dragging,.stage.dragging .node{cursor:grabbing}
.stage.is-done #mapSvg{touch-action:none}
.node:focus-visible path{stroke:var(--blue);stroke-width:6}
.lbl{font-family:var(--display);font-weight:800;letter-spacing:-.01em;pointer-events:none}
.lbl.halo{paint-order:stroke;stroke:#ffffff;stroke-width:7px;stroke-linejoin:round}
.grain{opacity:.35}
.sub{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;pointer-events:none}
.curio text{font-family:var(--mono);font-size:12px;fill:var(--ink);pointer-events:none}
.ctitle{letter-spacing:.08em;text-decoration:underline}
.cnode{cursor:pointer;outline:none}
.cnode:hover .vis,.cnode:focus-visible .vis{stroke-width:3.2}
.cnode:focus-visible text{font-weight:500}
#wm{font-family:var(--display);font-weight:800;fill:var(--ink);opacity:.07;pointer-events:none}

/* UI chrome */
.chip-btn{border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;min-height:44px}
.chip-btn:hover{background:var(--ink);color:var(--paper)}
#skip{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));z-index:5}
#replay{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));z-index:5}
#hint{position:absolute;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;pointer-events:none}
#hint span.line{width:2px;height:34px;background:var(--ink);animation:drip 1.4s ease-in-out infinite;transform-origin:top}
@keyframes drip{0%{transform:scaleY(.2)}50%{transform:scaleY(1)}100%{transform:scaleY(.2)}}
#placeholderTag{position:absolute;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font-family:var(--mono);font-size:11px;letter-spacing:.06em;background:var(--paper);border:1.5px solid var(--ink);padding:6px 10px;border-radius:4px;max-width:calc(100% - 140px)}

#crumbs{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));right:150px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;z-index:5;font-family:var(--mono);font-size:13px}
#crumbs button{background:none;border:0;padding:10px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;min-height:44px}
#crumbs .sep{opacity:.5}
#crumbs [aria-current]{font-weight:500;padding:10px 4px}
#backBtn{margin-right:8px}

#dots{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:flex-end;gap:2px;z-index:9}
#dots .row{display:flex;align-items:center;gap:10px}
#dots button{width:28px;height:28px;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer}
#dots button[disabled]{cursor:default}
#dots i{display:block;width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);box-sizing:border-box;background:var(--paper);transition:transform .2s,background .2s}
#dots button.on i{background:var(--ink);transform:scale(1.25)}
#dots .tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--paper);border:1.5px solid var(--ink);padding:3px 7px;border-radius:3px;white-space:nowrap}

#legend{position:absolute;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;z-index:4;pointer-events:none}
#legend span{display:flex;align-items:center;gap:6px}
#legend b{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);box-sizing:border-box}
#legend b.fill{background:var(--ink)}
#legend b.open{background:var(--paper)}
#pickHint{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;pointer-events:none;z-index:4;white-space:nowrap}

/* Page (Main layout from the sketch) */
#page{position:absolute;inset:0;z-index:8;background:var(--paper);overflow:auto}
.page-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100%}
.page-text{padding-block:calc(20px + env(safe-area-inset-top,0px)) 32px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:48px;display:flex;flex-direction:column;gap:22px;min-width:0}
.page-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.page-crumbs{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.pull{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.pull i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);display:inline-block}
#page h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,5vw,60px);line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
.lede{font-size:clamp(18px,1.8vw,22px);line-height:1.4;font-weight:500;margin:0;max-width:34ch}
#page h2{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;margin:0 0 8px}
.story p{margin:0;line-height:1.6;max-width:60ch}
.story ul{margin:10px 0 0;padding-left:20px;line-height:1.6;max-width:60ch}
.story li+li{margin-top:4px}
.ph{color:var(--muted);text-decoration:underline dashed 1.5px;text-underline-offset:4px}
.conn{display:flex;flex-wrap:wrap;gap:8px}
.conn button{border:1.5px solid var(--ink);background:none;border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;min-height:40px}
.conn button:hover{background:var(--ink);color:var(--paper)}
.conn button.lk{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:3px;border-radius:12px;padding:10px 14px;text-align:left}
.conn button.lk b{font-weight:600;font-size:15px}
.conn button.lk span{font-size:13px;color:var(--muted);line-height:1.4}
.conn button.lk:hover span{color:var(--paper)}
.thumbs{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;margin-top:auto}
.thumbs div{flex:0 0 112px;height:84px;border:2px solid var(--ink);background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(40,40,42,.12) 10px 11px),var(--paper)}
.thumbs .arrow{flex:0 0 auto;border:0;background:none;display:grid;place-items:center;font-size:24px;width:30px}
.proof{position:relative;min-height:320px;border-left:2px solid var(--ink);display:flex;align-items:flex-end;padding:24px;padding-right:max(64px,env(safe-area-inset-right,0px))}
.proof .cap{background:var(--paper);border:2px solid var(--ink);padding:10px 14px;font-family:var(--mono);font-size:12px;letter-spacing:.04em;max-width:100%}

@media (max-width:820px){
  .page-grid{grid-template-columns:minmax(0,1fr)}
  .proof{order:-1;min-height:0;aspect-ratio:16/10;border-left:0;border-bottom:2px solid var(--ink)}
  .page-text{padding-right:max(56px,env(safe-area-inset-right,0px))}
  #legend{display:none}
}
@media (prefers-reduced-motion:reduce){
  .grain,#hint span.line{animation:none}
}
</style>

</head>
<body>
<section id="intro" aria-label="Intro">
  <div class="stage" id="stage">
    <div class="grain" aria-hidden="true"></div>

    <svg id="introSvg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Illustrated bust of Scott. Scrolling opens his head and zooms into his brain.">
      <defs>
        <filter id="boil" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence id="boilT" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1"></feTurbulence>
          <feDisplacementMap in="SourceGraphic" scale="3.5"></feDisplacementMap>

      <g stroke="#1a1a1a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <g id="charInk" filter="url(#boil)">

            <circle class="pupil" cx="376" cy="324" r="7" fill="#1a1a1a" stroke="none"></circle>

          <g transform="translate(298 150) scale(.85)">

              <path d="M120 22 C110 60 132 92 118 150 M72 50 C92 62 84 82 62 92 M168 46 C150 66 176 86 160 104 M48 116 C70 108 84 124 74 140 M182 120 C196 106 210 112 214 100" fill="none" stroke-width="3"></path>

            <g class="bv" style="display:none">
              <path d="M30 100 C14 70 34 34 72 34 C84 12 128 10 144 28 C170 14 214 30 214 64 C236 78 234 116 210 128 C206 150 172 160 150 148 C132 162 92 162 78 148 C50 154 26 132 30 100 Z" fill="#ffffff" transform="translate(26 2) scale(.82 1)"></path>
              <path d="M146 140 C164 152 190 150 204 132 M90 40 C112 58 100 84 76 92 M150 40 C138 66 162 84 150 108 M64 116 C88 106 104 122 96 140 M118 92 C134 100 150 96 160 86" fill="none" stroke-width="3"></path>

      </g>
    </svg>

    <div id="mapLayer">
      <svg id="mapSvg" aria-label="Brain map. Choose Learn, Teach, or Improve to go deeper.">
        <defs>
          <pattern id="halftone" width="7" height="7" patternUnits="userSpaceOnUse">
            <rect width="7" height="7" fill="#ffffff"></rect>
            <circle cx="3.5" cy="3.5" r="1.4" fill="#1a1a1a"></circle>
          </pattern>

        <g id="bgNet" aria-hidden="true"></g>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
(function(){
  gsap.registerPlugin(ScrollTrigger);
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function D(x){ return reduce ? 0 : x; }
  var INK = '#1a1a1a', PAPER = '#ffffff';
  var NS = 'http://www.w3.org/2000/svg';

  /* ---------- content: Scott's merged outline ---------- */
  var PH_LEDE = '[One line: what this is to me]';
  var PH_STORY = '[The story: how I got here and why it stuck]';
  /* Content from Brain Map: Content Source (Scott's words) + Gap Drafts where the doc is still blank.
     links: { to: node id, why: one line } become "Connects to" jumps anywhere in the brain. */
  var ROOT = { id:'root', label:'Brain', kids:[
    { id:'learn', label:'Learn', fill:'#1a1a1a', text:'#ffffff', swatch:'#1a1a1a', tint:'#ffffff', kids:[
      { id:'illus', label:'Illustration', kids:[
        { id:'roots', label:'Where it started', page:{
          lede:'Started here and never left.',
          story:'It started in Detroit with my mom noticing I could draw. That turned into art classes, then custom pieces for family. After we moved to Arizona I took AP Studio Art at Chandler High and figure drawing at Maricopa Community College, which led to an $80K scholarship to CCS.',
          list:['Art classes, then custom art for family','AP Studio Art at Chandler High School','Figure drawing at Maricopa Community College','$80K scholarship to the College for Creative Studies'],
          proof:'MCC · BFA, CCS · SACI International',
          links:[{ to:'ccs', why:'Where the scholarship took me.' },{ to:'wesson', why:'Where my illustration lives now.' }] }},
        { id:'ccs', label:'CCS, BFA Illustration', page:{
          lede:'Came for illustration, left as a designer.',
          story:'I started in illustration but quickly found interest in other facets of design: graphic design, typography, package design, and UI/UX. I built my own mix of illustration, package design, and graphic design.',
          proof:'BFA in Illustration, College for Creative Studies',
          links:[{ to:'saci', why:'Studied abroad while at CCS.' },{ to:'irule', why:'Where design took me after school.' },{ to:'pack', why:'Package design started here.' }] }},
        { id:'saci', label:'SACI, Florence', page:{
          lede:'Studied abroad at SACI International in Florence, Italy.',
          list:['Graphic design',"Children's book illustration",'Sculpture'],
          proof:'SACI International',
          links:[{ to:'ccs', why:'Part of my time at CCS.' }] }},
        { id:'sketch', label:'Sketchbook', page:{
          lede:'Let loose.',
          story:'Random thoughts and drawings, shapes and wireframes. No client, no brief. This site started on these pages.',
          proof:'[Photos of sketchbook spreads]',
          links:[{ to:'wesson', why:'Quick thoughts here turn into finished pieces.' },{ to:'motion', why:'The storyboard for this site came from here.' }] }} ]},
      { id:'uiux', label:'UI/UX', kids:[
        { id:'irule', label:'iRule / On Controls', page:{
          lede:'Where I cut my teeth in user interface design.',
          story:'Sr. UX/UI Designer, March 2015 to July 2018, in Detroit. I built a design system and library of custom mobile interfaces that wirelessly control lights, thermostats, shades, and appliances across the iRule, On Controls, and Kramer brands.',
          list:['Created a design system and library of custom UIs for mobile devices','Worked with R&D, the dev team, and leadership through wireframes, prototypes, and UX flow charts','Simplified older designs to reflect modern best practices, improving customer experience and workflow','Designed the iRule logo'],
          links:[{ to:'systems', why:'My first real design system.' },{ to:'brand', why:'I designed the iRule logo.' },{ to:'c4', why:'Where I designed apps for a living.' }] }},
        { id:'civilla', label:'Civilla', page:{
          lede:'Design research that shaped services for 2M+ Michigan residents.',
          story:'Sr. UX/UI Designer and Design Researcher at Civilla, a small but mighty team. I conducted interviews, defined problems, ideated, prototyped, user tested, and helped implement across state and government institutions. It is where I learned to really be part of a team.',
          list:['Built 75+ web and mobile prototypes for state and federal initiatives','User research informing services for 2M+ residents','Design lead on a multi-agency benefits platform','Developed core journey map design and facilitation, walkthroughs, and brand collateral','Worked with the Michigan Secretary of State, Michigan Health and Human Services, Starfish, Deloitte, and more'],
          proof:'civilla.com',
          links:[{ to:'c2', why:'The design thinking I practiced here is what I teach now.' },{ to:'sedstudio', why:'Brought the same process to small businesses.' },{ to:'systems', why:'Forms and flows for state agencies.' }] }},
        { id:'systems', label:'Component systems', page:{
          lede:'Build the pieces once, use them everywhere.',
          story:'From remote control interface libraries at iRule to forms and flows for state agencies at Civilla.',
          links:[{ to:'irule', why:'Where the first system came from.' },{ to:'civilla', why:'Forms and flows at government scale.' }] }},
        { id:'a11y', label:'Accessibility audits', page:{
          lede:'Making sure everyone can actually use it.',
          story:'Speed and accessibility audits for nonprofit and small business sites.',
          proof:'Speed and accessibility audit, dreamofdetroit.org',

  }

  function hubOf(node){ return node === ROOT ? null : (node.hub || node); }
  function groundFor(node){ var h = hubOf(node); return h ? h.tint : '#ffffff'; }
  function setChrome(node){
    var wmText = node === ROOT ? '' : node.label.toUpperCase();
    wm.textContent = wmText;
    wm.setAttribute('x', W / 2); wm.setAttribute('y', H / 2);
    wm.setAttribute('font-size', Math.min(M * .32, W * 1.5 / Math.max(4, wmText.length)).toFixed(0));
    gsap.to([curioG, curioLinksG], { opacity: node === ROOT ? 1 : 0, duration:D(.4) });
    curioG.style.pointerEvents = node === ROOT ? '' : 'none';
    legend.hidden = node === ROOT;
    pickHint.style.opacity = node === ROOT ? 1 : 0;
  }

  function retire(v){
    v.items.forEach(function(it){ it.g.style.pointerEvents = 'none'; dying.push(it); });
    v.links.forEach(function(l){ dying.push(l); });
  }
  function bury(list){
    list.forEach(function(x){ var e = x.g || x.p; if (e && e.parentNode) e.parentNode.removeChild(e); });
    dying = dying.filter(function(x){ return list.indexOf(x) < 0; });
  }

  /* mode: 'dive' from an item, 'rise' going back up, 'instant' */
  function swapView(node, mode, fromItem){
    var old = view;
    if (mode === 'instant'){
      bury(old.items.concat(old.links));
      view = buildView(node);
      mapLayer.style.background = groundFor(node);
      setChrome(node);
      return;
    }
    busy = true;
    retire(old);
    view = { items:[], links:[] };
    var oldList = old.items.concat(old.links);
    var t = gsap.timeline({ onComplete:function(){ bury(oldList); busy = false; } });
    if (mode === 'dive' && fromItem){
      nodesG.appendChild(fromItem.g);
      t.to(fromItem, { x:W / 2, y:H / 2, r:Math.hypot(W, H) * .62, duration:D(.85), ease:'power3.inOut' }, 0);
      old.items.forEach(function(o){
        if (o === fromItem) return;
        var dx = o.x - W / 2, dy = o.y - H / 2, a = Math.atan2(dy, dx) + 1.9, d = Math.hypot(dx, dy) * 1.5 + 60;
        t.to(o, { x:W / 2 + Math.cos(a) * d, y:H / 2 + Math.sin(a) * d, s:.25, o:0, duration:D(.75), ease:'power2.in' }, 0);
      });
      t.add(function(){
        mapLayer.style.background = groundFor(node);
        view = buildView(node);
        setChrome(node);
        view.items.forEach(function(it){ it.s = 0; it.o = 0; });
        gsap.to(view.items, { s:1, o:1, duration:D(.6), ease:'back.out(1.7)', stagger:D(.05) });
        renderUI();
      }, D(.8));
      t.to(fromItem, { o:0, duration:D(.45) }, D(.85));
    } else {
      old.items.forEach(function(o){ t.to(o, { s:.35, o:0, duration:D(.4), ease:'power2.in' }, 0); });
      t.add(function(){
        mapLayer.style.background = groundFor(node);
        view = buildView(node);
        setChrome(node);
        view.items.forEach(function(it){ it.s = 1.8; it.o = 0; });
        gsap.to(view.items, { s:1, o:1, duration:D(.6), ease:'power3.out', stagger:D(.04) });
        renderUI();
      }, D(.35));
      t.to({}, { duration:D(.5) });
    }
  }

  function activate(it){
    if (busy || !done || it.o < .5) return;
    if (it.deeper){ stack.push(it.node); swapView(it.node, 'dive', it); renderUI(); }
    else openPage(it.node, it);
  }
  function goTo(depth){
    if (busy) return;
    if (pageNode) closePage();
    if (depth >= stack.length) return;
    stack.length = depth;
    swapView(stack[depth - 1], 'rise');
    renderUI();
  }

  /* ---------- page ---------- */
  function phText(s){ return /^\[.*\]$/.test(s) ? '<span class="ph">' + s + '</span>' : s; }
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function openPage(node, it){
    pageNode = node;
    var p = node.page || {}, hub = node.hub || node;
    var trail = stack.slice(1).map(function(n){ return n.label; });
    if (node.curio && node !== CURIO_ROOT) trail.push(CURIO_ROOT.label);
    trail.push(node.label);
    document.getElementById('pCrumbs').textContent = ['Brain'].concat(trail).join(' / ');
    document.getElementById('pPull').innerHTML = node.curio
      ? '<i style="background:#ffffff;border-style:dashed"></i>Outer orbit · not pulled in yet'
      : '<i style="background:' + hub.swatch + '"></i>Pulled toward ' + esc(hub.label);
    document.getElementById('pTitle').textContent = node.label;
    document.getElementById('pLede').innerHTML = phText(esc(p.lede || PH_LEDE));
    document.getElementById('pStory').innerHTML = phText(esc(p.story || PH_STORY));
    var list = document.getElementById('pList');
    var hubName = function(id){ return ROOT.kids.filter(function(k){ return k.id === id; })[0].label; };
    var items = p.list || (node === CURIO_ROOT ? node.kids.map(function(k){
      return k.label + (k.sub ? ' ' + k.sub : '') + ': feeds ' + k.hubs.map(hubName).join(' and ');
    }) : []);
    list.innerHTML = items.map(function(s){ return '<li>' + phText(esc(s)) + '</li>'; }).join('');
    list.hidden = !items.length;
    var conn = document.getElementById('pConn'); conn.innerHTML = '';
    var nLinks = 0;
    (p.links || []).forEach(function(l){
      var t = BYID[l.to]; if (!t) return;
      var b = document.createElement('button'); b.type = 'button'; b.className = 'lk';
      b.innerHTML = '<b>' + esc(t.label) + ' →</b><span>' + esc(l.why) + '</span>';
      b.addEventListener('click', function(){ goToNode(t); });
      conn.appendChild(b); nLinks++;
    });
    (node.hubs || []).forEach(function(h){
      var b = document.createElement('button'); b.type = 'button'; b.textContent = 'Feeds ' + hubName(h) + ' ↗';
      b.addEventListener('click', function(){ diveTo(h); });
      conn.appendChild(b);
    });
    var sibs = node === CURIO_ROOT ? node.kids.slice() :
      (node.parent && node.parent.kids || []).filter(function(s){ return s !== node && !(s.kids && s.kids.length); });
    if (node.also) sibs.sort(function(a, b){ return (node.also.indexOf(b.id) >= 0) - (node.also.indexOf(a.id) >= 0); });
    if (!sibs.length && !nLinks && !(node.hubs || []).length){ conn.innerHTML = '<span class="ph">[Connected node]: [why they connect]</span>'; }
    if (nLinks) sibs = sibs.filter(function(s){ return !(p.links || []).some(function(l){ return l.to === s.id; }); });
    sibs.slice(0, nLinks ? 4 : 6).forEach(function(s){
      var b = document.createElement('button'); b.type = 'button'; b.textContent = s.label + ' →';
      b.addEventListener('click', function(){ openPage(s, null); page.scrollTop = 0; });
      conn.appendChild(b);
    });
    var proof = document.getElementById('pProof');
    proof.style.background = 'repeating-linear-gradient(135deg, transparent 0 18px, rgba(40,40,42,.14) 18px 20px), ' + (hub.tint || '#ffffff');
    document.getElementById('pProofCap').textContent = p.proof ? 'Proof: ' + p.proof : '[Proof: image, video, live embed, or link]';
    if (page.hidden){
      if (it) gsap.to(it, { s:1.5, duration:D(.3), yoyo:true, repeat:1 });
      page.hidden = false;
      gsap.fromTo(page, { opacity:0, y:30 }, { opacity:1, y:0, duration:D(.45), ease:'power3.out', delay:D(.15) });
    }
    document.getElementById('pTitle').focus({ preventScroll:true });
    renderUI();
  }
  function closePage(instant){
    if (!pageNode) return;
    pageNode = null;
    if (instant){ page.hidden = true; renderUI(); return; }
    gsap.to(page, { opacity:0, y:20, duration:D(.3), onComplete:function(){ page.hidden = true; } });
    renderUI();
  }
  document.getElementById('pBack').addEventListener('click', function(){ closePage(); });
  /* jump anywhere in the brain from a "Connects to" link: rebuild the path, then land on the page or the level */
  function goToNode(n){
    if (busy) return;
    var path = [];
    for (var x = n; x; x = x.parent) path.unshift(x);
    if (path[0] !== ROOT) return;
    closePage(true);
    if (n.kids && n.kids.length){
      stack = path;
      swapView(n, 'instant');
      renderUI();
    } else {
      stack = path.slice(0, -1);
      swapView(stack[stack.length - 1], 'instant');
      openPage(n, null);
      page.scrollTop = 0;
    }
  }
  /* from a curiosity page, jump straight into the hub it feeds */
  function diveTo(id){
    closePage(true);
    var it = view.items.filter(function(i){ return i.node.id === id; })[0];
    if (it) activate(it);
  }

  /* ---------- crumbs + dots ---------- */
  function renderUI(){
    crumbs.innerHTML = '';
    if (done){
      if (stack.length > 1 || pageNode){
        var back = document.createElement('button'); back.type = 'button'; back.className = 'chip-btn'; back.id = 'backBtn';
        back.textContent = '← Back';
        back.style.textDecoration = 'none';
        back.addEventListener('click', function(){ if (pageNode) closePage(); else goTo(stack.length - 1); });
        crumbs.appendChild(back);
      }
      stack.forEach(function(n, i){
        if (i) { var s = document.createElement('span'); s.className = 'sep'; s.textContent = '/'; crumbs.appendChild(s); }
        var last = i === stack.length - 1 && !pageNode;
        if (last){ var c = document.createElement('span'); c.setAttribute('aria-current', 'location'); c.textContent = n.label; crumbs.appendChild(c); }
        else { var b = document.createElement('button'); b.type = 'button'; b.textContent = n.label;
          b.addEventListener('click', function(){ goTo(i + 1); }); crumbs.appendChild(b); }
      });
    }
    var depth = !done ? 0 : Math.min(4, pageNode ? stack.length + 1 : stack.length);
    var tags = ['Intro'].concat(stack.map(function(n){ return n.label; }));
    if (pageNode) tags[depth] = 'Page';
    dots.innerHTML = '';
    for (var i = 0; i < 5; i++){
      var row = document.createElement('div'); row.className = 'row';
      if (i === depth){ var tg = document.createElement('span'); tg.className = 'tag'; tg.id = 'dotTag'; tg.textContent = !done ? 'Intro' : (tags[i] || ''); row.appendChild(tg); }
      var b = document.createElement('button'); b.type = 'button';
      b.setAttribute('aria-label', i === 0 ? 'Replay intro' : 'Level ' + i + (tags[i] ? ': ' + tags[i] : ''));
      if (i === depth){ b.className = 'on'; b.setAttribute('aria-current', 'step'); }
      var reachable = done && i < depth;
      if (!reachable) b.disabled = true;
      (function(i){ b.addEventListener('click', function(){ if (i === 0) replayIntro(); else goTo(i); }); })(i);
      b.appendChild(document.createElement('i'));
      row.appendChild(b);
      dots.appendChild(row);
    }
  }
  function dotsTag(s){ var t = document.getElementById('dotTag'); if (t) t.textContent = s; }

  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape' || !done) return;
    if (pageNode) closePage(); else if (stack.length > 1) goTo(stack.length - 1);
  });

  /* ---------- render loop ---------- */
  mapSvg.addEventListener('pointermove', function(e){
    if (e.pointerType === 'touch') return;
    var r = mapSvg.getBoundingClientRect(); mouse = { x:e.clientX - r.left, y:e.clientY - r.top };
  });
  mapSvg.addEventListener('pointerleave', function(){ mouse = null; });

  /* press and drag: rubber-band the blob, spring back on release, a still press counts as a click */
  var drag = null;
  window.addEventListener('pointermove', function(e){
    if (!drag || e.pointerId !== drag.id) return;
    var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy, dist = Math.hypot(dx, dy);
    if (dist > 6) drag.moved = true;
    var eff = dist / (1 + dist / (M * .55)), f = dist ? eff / dist : 0;
    drag.it.dragX = dx * f; drag.it.dragY = dy * f;
  });
  function endDrag(e){
    if (!drag || e.pointerId !== drag.id) return;
    var d = drag; drag = null;
    stage.classList.remove('dragging');
    gsap.to(d.it, { dragX:0, dragY:0, duration:D(1.3), ease:'elastic.out(1, 0.28)' });
    if (d.type !== 'mouse') d.it.hover = false;
    if (e.type === 'pointerup' && !d.moved) activate(d.it);
  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  function drawItem(it, t){
    var tx = 0, ty = 0;
    if (mouse && done){
      var f = it.hover ? .1 : .03, cap = it.hover ? 26 : 12;
      tx = clamp((mouse.x - it.x) * f, -cap, cap); ty = clamp((mouse.y - it.y) * f, -cap, cap);
    }
    it.lx += (tx - it.lx) * .12; it.ly += (ty - it.ly) * .12;
    it.hs += ((it.hover && done ? 1.07 : 1) - it.hs) * .15;
    var base = Math.max(.1, it.r * it.s);
    /* hover: the near side reaches toward the cursor */
    var hpx = 0, hpy = 0;
    if (mouse && done && !drag){
      var mdx = mouse.x - it.x, mdy = mouse.y - it.y, md = Math.hypot(mdx, mdy), reach = base * 2.2;
      if (md < reach && md > 0){
        var str = (1 - md / reach) * (it.hover ? .34 : .2) * base;
        hpx = mdx / md * str; hpy = mdy / md * str;
      }
    }
    it.px += (hpx - it.px) * .14; it.py += (hpy - it.py) * .14;
    var cx = it.x + it.lx + it.dragX * .45, cy = it.y + it.ly + it.dragY * .45;
    var rr = base * it.hs;
    it.path.setAttribute('d', blobPath(cx, cy, rr, t, it.seed, it.amp, it.px + it.dragX * .7, it.py + it.dragY * .7));
    it.g.style.opacity = it.o;
    var fs, ly, sy;
    if (it.isHub){
      fs = clamp(rr * .3, 16, 260);
      ly = cy + fs * .35 - (it.lines - 1) * fs * .55;
      sy = cy + rr * .45;
      it.sub.style.opacity = rr > 240 ? 0 : 1;
    } else {
      fs = clamp(M * .026, 14, 20);
      ly = cy + rr + fs + 6;
      sy = ly + fs * 1.1 * (it.lines - 1) + 18;
    }
    it.lbl.setAttribute('font-size', fs.toFixed(1));
    it.lbl.setAttribute('y', ly.toFixed(1));
    it.spans.forEach(function(s){ s.setAttribute('x', cx.toFixed(1)); });
    it.sub.setAttribute('x', cx.toFixed(1)); it.sub.setAttribute('y', sy.toFixed(1));
    it.cx = cx; it.cy = cy; it.rr = rr;
  }
  function drawLink(l, t){
    var a = l.a, b = l.b; if (a.cx === undefined || b.cx === undefined) return;
    var mx = (a.cx + b.cx) / 2, my = (a.cy + b.cy) / 2, dx = b.cx - a.cx, dy = b.cy - a.cy, len = Math.hypot(dx, dy) || 1;
    var w = 22 * Math.sin(t * .8 + l.k * 1.7);
    l.p.setAttribute('d', 'M' + a.cx.toFixed(1) + ' ' + a.cy.toFixed(1) + ' Q' + (mx - dy / len * w).toFixed(1) + ' ' + (my + dx / len * w).toFixed(1) + ' ' + b.cx.toFixed(1) + ' ' + b.cy.toFixed(1));
    l.p.style.opacity = Math.min(a.o, b.o);
  }
  function frame(now){
    var t = reduce ? 0 : now / 1000;
    if (done || tl.progress() > .8){
      view.items.forEach(function(it){ drawItem(it, t); });
      dying.forEach(function(x){ if (x.g) drawItem(x, t); });
      view.links.forEach(function(l){ drawLink(l, t); });
      dying.forEach(function(x){ if (x.p) drawLink(x, t); });
      drawCurio(t);
      if (mouse && !reduce) bgNet.setAttribute('transform', 'translate(' + ((W / 2 - mouse.x) * .015).toFixed(1) + ' ' + ((H / 2 - mouse.y) * .015).toFixed(1) + ')');
    }
    requestAnimationFrame(frame);
  }

  function relayout(){
    measure(); drawBg();
    var node = stack[stack.length - 1], pos = layout(node);
    view.items.forEach(function(it, i){ if (pos[i]){ it.x = pos[i].x; it.y = pos[i].y; it.r = pos[i].r; } });
    setChrome(node);
  }
  /* tall phone screens: crop in on the bust so it fills the height instead of floating small */
  var introSvgEl = document.getElementById('introSvg');
  function fitIntro(){
    var r = stage.getBoundingClientRect();
    introSvgEl.setAttribute('viewBox', r.width / r.height < .8 ? '190 30 420 570' : '0 0 800 600');
  }
  window.addEventListener('resize', function(){ fitIntro(); if (!busy) relayout(); });

  /* ---------- boot ---------- */
  fitIntro();
  measure(); drawBg();
  view = buildView(ROOT);
  mapLayer.style.background = groundFor(ROOT);
  setChrome(ROOT);
  renderUI();
  requestAnimationFrame(frame);
  if (reduce) finishIntro(); else makeTrigger();
})();
</script>

</body>
</html>
